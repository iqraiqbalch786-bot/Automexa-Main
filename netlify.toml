# Preview + production config for Netlify. The site is a static Astro build (dist/);
# server code: netlify/functions/lead.mjs (POST /api/lead) and newsletter.mjs (POST /api/newsletter).
[build]
  # This Netlify site is the PREVIEW (noindex). Live builds use `npm run build:live`.
  command = "npm run build:preview"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# One canonical host: www -> apex (Netlify already forces HTTP -> HTTPS once a cert is issued; HSTS below)
[[redirects]]
  from = "https://www.automexa.co.uk/*"
  to = "https://automexa.co.uk/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://www.automexa.co.uk/*"
  to = "https://automexa.co.uk/:splat"
  status = 301
  force = true

# Old automexa.co.uk routes -> new IA (keeps any existing links and rankings)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
[[redirects]]
  from = "/portfolio"
  to = "/work/"
  status = 301
[[redirects]]
  from = "/scorecard"
  to = "/missed-call-calculator/"
  status = 301
[[redirects]]
  from = "/pay"
  to = "/pricing/"
  status = 301
[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-SsFxDiC7QUFRtFt3RrbxfUMHr6hhQYiqNZlselxjz4A=' https://adev-web-developer-plugin.adeelcolchester.workers.dev https://plausible.io https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://adev-web-developer-plugin.adeelcolchester.workers.dev https://plausible.io https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://challenges.cloudflare.com; media-src 'self' blob:; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
[[headers]]
  for = "/work/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
